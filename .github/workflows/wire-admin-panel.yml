name: Wire DRIGHT Administrator panel
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-panel-complete]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire admin route and sidebar access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          if "import AdminPanel from './AdminPanel';" not in s:
              s=s.replace("import {supabase} from './supabase';", "import {supabase} from './supabase';\nimport AdminPanel from './AdminPanel';")
          s=s.replace("type Page='welcome'|'get-started'|'market'|'product'|'signin';", "type Page='welcome'|'get-started'|'market'|'product'|'signin'|'admin';")
          old="const signOut=async()=>{await supabase.auth.signOut();setSidebarOpen(false);setPage('welcome')};"
          new="const signOut=async()=>{await supabase.auth.signOut();setSidebarOpen(false);setPage('welcome')}; const openAdmin=async()=>{const {data,error}=await supabase.rpc('is_admin'); if(!error&&data===true){setSidebarOpen(false);setPage('admin')}};"
          if old in s:s=s.replace(old,new,1)
          marker="{page==='get-started'?<GetStartedPage"
          if marker in s and "page==='admin'?<AdminPanel" not in s:
              s=s.replace(marker,"{page==='admin'?<AdminPanel onBack={()=>setPage('market')}/>:"+marker,1)
          # Pass admin callback into Sidebar; the Sidebar can render the item when provided.
          old="<Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onWelcome={()=>setPage('welcome')} onMarket={()=>setPage('market')} onSignOut={signOut}/>"
          new="<Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onWelcome={()=>setPage('welcome')} onMarket={()=>setPage('market')} onSignOut={signOut} onAdmin={openAdmin}/>"
          s=s.replace(old,new,1)
          # Inject a conservative admin button into the existing Sidebar JSX before the sidebar nav closes.
          if "onAdmin:()=>void" not in s:
              s=s.replace("onSignOut:()=>void})", "onSignOut:()=>void;onAdmin?:()=>void})")
          needle="onSignOut}){"
          if needle in s:
              s=s.replace(needle,"onSignOut,onAdmin}){",1)
          nav="<div className=\"sidebar-nav\">"
          if nav in s and "DRIGHT Administrator" not in s:
              # Add a gated button. It verifies again server-side through the RPC before opening the panel.
              s=s.replace(nav,nav+"{onAdmin&&<button onClick={onAdmin} title=\"Admin Panel\"><ShieldCheck size={18}/> Admin Panel</button>}",1)
          if "ShieldCheck" not in s.split("function App",1)[0]:
              s=s.replace("HelpCircle, LogOut}","HelpCircle, LogOut, ShieldCheck}",1)
          p.write_text(s)
          
          p=Path('src/styles.css')
          s=p.read_text()
          css='''\n.admin-panel-page{min-height:100vh;display:flex;background:var(--surface-soft,#f8fafc);color:var(--text,#0f172a)}.admin-panel-sidebar{width:260px;background:#fff;border-right:1px solid #e2e8f0;padding:22px 14px;display:flex;flex-direction:column}.admin-brand{display:flex;align-items:center;gap:11px;padding:10px 10px 24px}.admin-brand-mark{width:42px;height:42px;border-radius:12px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.admin-brand strong{display:block;font-size:16px}.admin-brand small{display:block;color:#64748b;font-size:11px;margin-top:2px}.admin-panel-sidebar nav{display:grid;gap:4px}.admin-panel-sidebar nav button,.admin-back{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:11px 12px;border-radius:11px;color:#64748b;text-align:left;cursor:pointer}.admin-panel-sidebar nav button:hover,.admin-panel-sidebar nav button.active{background:#f1f5f9;color:#0f172a}.admin-back{margin-top:auto}.admin-panel-main{flex:1;padding:40px;max-width:1200px}.admin-eyebrow{font-size:11px;letter-spacing:.14em;color:#64748b;font-weight:800}.admin-panel-main h1{font-size:34px;margin:8px 0}.admin-panel-main p{color:#64748b}.admin-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}.admin-cards div{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.admin-cards strong,.admin-cards span{display:block}.admin-cards span{font-size:13px;color:#64748b;margin-top:7px}@media(max-width:760px){.admin-panel-sidebar{width:220px}.admin-panel-main{padding:24px}.admin-cards{grid-template-columns:1fr}}\n'''
          if '.admin-panel-page' not in s:s+=css
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/wire-admin-panel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx src/styles.css .github/workflows/wire-admin-panel.yml
          git diff --cached --quiet || git commit -m 'Wire DRIGHT Administrator panel [admin-panel-complete]'
          git push
