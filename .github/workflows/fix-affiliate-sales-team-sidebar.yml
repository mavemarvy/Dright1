name: Wire Affiliate Sales Team navigation

on:
  push:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/AffiliateDashboard.tsx'
      - '.github/workflows/fix-affiliate-sales-team-sidebar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-sales-team:
    if: ${{ !contains(github.event.head_commit.message, '[affiliate-sales-team-nav]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire the real Sales Team destination
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/main.tsx')
          s = p.read_text()

          if 'const [affiliateTab,setAffiliateTab]' not in s:
              s = s.replace(
                  "const [themeOpen,setThemeOpen]=useState(false); const [sidebarOpen,setSidebarOpen]=useState(false);",
                  "const [themeOpen,setThemeOpen]=useState(false); const [sidebarOpen,setSidebarOpen]=useState(false); const [affiliateTab,setAffiliateTab]=useState<string>('Affiliate Dashboard');",
                  1,
              )

          old_open = "const openAffiliate=()=>{setSidebarOpen(false);setPage('affiliate-dashboard')};"
          new_open = "const openAffiliate=()=>{setSidebarOpen(false);setAffiliateTab('Affiliate Dashboard');setPage('affiliate-dashboard')}; const openAffiliateSalesTeam=()=>{setSidebarOpen(false);setAffiliateTab('Sales Team');setPage('affiliate-dashboard')};"
          if old_open in s:
              s = s.replace(old_open, new_open, 1)

          s = s.replace(
              "onAffiliateDashboard={openAffiliate} onSellerDashboard={openSeller}",
              "onAffiliateDashboard={openAffiliate} onAffiliateSalesTeam={openAffiliateSalesTeam} onSellerDashboard={openSeller}",
              1,
          )

          s = s.replace(
              "<AffiliateDashboard back={()=>setPage('market')} onMenu={()=>setSidebarOpen(true)}/>",
              "<AffiliateDashboard back={()=>setPage('market')} onMenu={()=>setSidebarOpen(true)} initialTab={affiliateTab}/>",
              1,
          )

          old_sig = "function Sidebar({open,onClose,onWelcome,onMarket,onLearning,onAffiliateAnalytics,onAffiliateDashboard,onSellerDashboard,onSignOut,onAdmin}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onLearning:()=>void;onAffiliateAnalytics:()=>void;onAffiliateDashboard:()=>void;onSellerDashboard:()=>void;onSignOut:()=>void;onAdmin?:()=>void})"
          new_sig = "function Sidebar({open,onClose,onWelcome,onMarket,onLearning,onAffiliateAnalytics,onAffiliateDashboard,onAffiliateSalesTeam,onSellerDashboard,onSignOut,onAdmin}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onLearning:()=>void;onAffiliateAnalytics:()=>void;onAffiliateDashboard:()=>void;onAffiliateSalesTeam:()=>void;onSellerDashboard:()=>void;onSignOut:()=>void;onAdmin?:()=>void})"
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)

          old_button = '<button onClick={onAffiliateDashboard}><Users size={18}/> Sales Team</button>'
          new_button = '<button onClick={onAffiliateSalesTeam}><Users size={18}/> Sales Team</button>'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)

          p.write_text(s)

          p = Path('src/AffiliateDashboard.tsx')
          s = p.read_text()
          s = s.replace(
              "export default function AffiliateDashboard({back,onMenu}:{back:()=>void;onMenu?:()=>void}){",
              "export default function AffiliateDashboard({back,onMenu,initialTab}:{back:()=>void;onMenu?:()=>void;initialTab?:string}){",
              1,
          )
          s = s.replace(
              "const [userId,setUserId]=useState<string|null>(null); const [links,setLinks]=useState<LinkMetric[]>([]); const [events,setEvents]=useState<Event[]>([]); const [range,setRange]=useState<Range>('Month'); const [loading,setLoading]=useState(true); const [error,setError]=useState(''); const [copied,setCopied]=useState<string|null>(null); const [tab,setTab]=useState('Affiliate Dashboard');",
              "const [userId,setUserId]=useState<string|null>(null); const [links,setLinks]=useState<LinkMetric[]>([]); const [events,setEvents]=useState<Event[]>([]); const [range,setRange]=useState<Range>('Month'); const [loading,setLoading]=useState(true); const [error,setError]=useState(''); const [copied,setCopied]=useState<string|null>(null); const [tab,setTab]=useState(initialTab||'Affiliate Dashboard');",
              1,
          )
          s = s.replace(
              "useEffect(()=>{let live=true;(async()=>{const {data:{user}}=await supabase.auth.getUser();",
              "useEffect(()=>{if(initialTab)setTab(initialTab)},[initialTab]);\n useEffect(()=>{let live=true;(async()=>{const {data:{user}}=await supabase.auth.getUser();",
              1,
          )
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'onAffiliateSalesTeam' src/main.tsx
          grep -q 'onClick={onAffiliateSalesTeam}' src/main.tsx
          grep -q 'initialTab={affiliateTab}' src/main.tsx
          grep -q 'initialTab?:string' src/AffiliateDashboard.tsx
          git diff --check
      - name: Commit wiring changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx src/AffiliateDashboard.tsx
          git commit -m 'fix: wire Affiliate Sales Team button [affiliate-sales-team-nav]'
          git push
