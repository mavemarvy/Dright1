name: Add sidebar profile switcher
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[profile-switcher-complete]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add collapsible profile switcher without changing existing sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          if 'profile-switcher-trigger' not in s:
              old="function Sidebar({open,onClose,onWelcome,onMarket,onSignOut}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onSignOut:()=>void}){"
              if old not in s: raise SystemExit('Sidebar signature not found')
              new="function Sidebar({open,onClose,onWelcome,onMarket,onSignOut}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onSignOut:()=>void}){const [profileOpen,setProfileOpen]=useState(false);const [activeProfile,setActiveProfile]=useState(()=>localStorage.getItem('dright-active-profile')||'Buyer');const profiles=[{name:'Buyer',description:'Discover and buy'},{name:'Seller',description:'Sell products and services'},{name:'Employer',description:'Hire and manage work'},{name:'Freelancer',description:'Offer skills and complete tasks'},{name:'Affiliate',description:'Promote and earn'}];const chooseProfile=(name:string)=>{setActiveProfile(name);localStorage.setItem('dright-active-profile',name);setProfileOpen(false)};"
              s=s.replace(old,new,1)
              marker='<div className="sidebar-logo"><DrightLogoIcon/></div><div className="sidebar-nav">'
              if marker not in s: raise SystemExit('Sidebar logo/navigation marker not found')
              insert='<div className="sidebar-logo"><DrightLogoIcon/></div><div className="sidebar-profile-switcher"><button type="button" className={`profile-switcher-trigger ${profileOpen?\'expanded\':\'\'}`} onClick={()=>setProfileOpen(v=>!v)} aria-expanded={profileOpen}><span className="profile-switcher-copy"><small>Switch profile</small><strong>{activeProfile}</strong></span><ChevronDown size={17} className={`profile-switcher-chevron ${profileOpen?\'rotated\':\'\'}`}/></button>{profileOpen&&<div className="profile-switcher-menu">{profiles.map(item=><button type="button" key={item.name} className={`profile-option ${activeProfile===item.name?\'active\':\'\'}`} onClick={()=>chooseProfile(item.name)}><span><strong>{item.name}</strong><small>{item.description}</small></span>{activeProfile===item.name&&<CheckCircle2 size={16}/>}</button>)}</div>}</div><div className="sidebar-nav">'
              s=s.replace(marker,insert,1)
              p.write_text(s)
          css=Path('src/styles.css')
          c=css.read_text()
          marker='/* Sidebar profile switcher — additive UI; existing navigation remains unchanged. */'
          if marker not in c:
              c+='''\n\n/* Sidebar profile switcher — additive UI; existing navigation remains unchanged. */\n.sidebar-profile-switcher{position:relative;margin:4px 14px 14px}.profile-switcher-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border,#e2e8f0);background:var(--surface,#fff);color:inherit;border-radius:14px;text-align:left;cursor:pointer}.profile-switcher-trigger:hover,.profile-switcher-trigger.expanded{background:var(--surface-soft,#f8fafc)}.profile-switcher-copy{display:flex;flex-direction:column;min-width:0}.profile-switcher-copy small{font-size:10px;color:var(--muted,#64748b);margin-bottom:3px}.profile-switcher-copy strong{font-size:13px}.profile-switcher-chevron{transition:transform .18s ease}.profile-switcher-chevron.rotated{transform:rotate(180deg)}.profile-switcher-menu{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 6px);padding:6px;background:var(--surface,#fff);border:1px solid var(--border,#e2e8f0);border-radius:14px;box-shadow:0 14px 32px rgba(15,23,42,.12)}.profile-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:0;background:transparent;color:inherit;border-radius:10px;text-align:left;cursor:pointer}.profile-option:hover,.profile-option.active{background:var(--surface-soft,#f8fafc)}.profile-option>span{display:flex;flex-direction:column}.profile-option strong{font-size:12px}.profile-option small{font-size:10px;color:var(--muted,#64748b);margin-top:2px}\n'''
              css.write_text(c)
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/add-profile-switcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx src/styles.css .github/workflows/add-profile-switcher.yml
          git commit -m 'Add collapsible sidebar profile switcher [profile-switcher-complete]'
          git push
