name: Wire affiliate dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[affiliate-wire]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire affiliate profile routing
        run: python3 .github/scripts/wire_affiliate_dashboard.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx .github/scripts/wire_affiliate_dashboard.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire affiliate dashboard [affiliate-wire]"
          git push
