name: Fix DRIGHT1 main build
on:
  push:
    branches: [main]
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[main-build-fixed]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix main.tsx JSX syntax and sidebar admin prop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old="{page==='admin'?<AdminPanel onBack={()=>setPage('market')}/>:{page==='get-started'?"
          new="{page==='admin'?<AdminPanel onBack={()=>setPage('market')}/>:page==='get-started'?"
          if old not in s:
              raise SystemExit('Expected admin/get-started JSX pattern was not found')
          s=s.replace(old,new,1)
          old2="function Sidebar({open,onClose,onWelcome,onMarket,onSignOut}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onSignOut:()=>void;onAdmin?:()=>void})"
          new2="function Sidebar({open,onClose,onWelcome,onMarket,onSignOut,onAdmin}:{open:boolean;onClose:()=>void;onWelcome:()=>void;onMarket:()=>void;onSignOut:()=>void;onAdmin?:()=>void})"
          if old2 not in s:
              raise SystemExit('Expected Sidebar signature was not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx
          git diff --cached --quiet || git commit -m 'Fix main JSX syntax and admin sidebar prop [main-build-fixed]'
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/fix-main-build.yml
          git add .github/workflows/fix-main-build.yml
          git diff --cached --quiet || git commit -m 'Remove one-time build fix workflow [main-build-fixed]'
          git push
