name: Integrate DRIGHT signup page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: integrate signup page') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate signup route and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          if "./SignupPage" not in s:
              s=s.replace("import './styles.css';", "import './styles.css';\nimport SignupPage from './SignupPage';")
          s=s.replace("const [page,setPage]=useState<'welcome'|'market'|'product'>('welcome');", "const [page,setPage]=useState<'welcome'|'market'|'product'|'signup'>('welcome');")
          s=s.replace("onSignUp={()=>setSignedIn(true)}", "onSignUp={()=>setPage('signup')}")
          s=s.replace("{page==='product'&&selected&&<ProductDetails product={selected} back={()=>setPage('market')} onProduct={openProduct}/>} <Footer/>", "{page==='product'&&selected&&<ProductDetails product={selected} back={()=>setPage('market')} onProduct={openProduct}/>} {page==='signup'&&<SignupPage themeClass={themes[theme].className} onBack={()=>setPage('welcome')} onComplete={()=>{setSignedIn(true);setPage('welcome')}}/>} {page!=='signup'&&<Footer/>}")
          p.write_text(s)
          PY
          cat >> src/styles.css <<'CSS'

/* DRIGHT signup page */
.signup-page{min-height:100vh;background:var(--bg);color:var(--text);padding-bottom:70px}.signup-top{height:76px;padding:0 4.5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.signup-back,.signup-signin button{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:700}.signup-signin{font-size:13px;color:var(--muted)}.signup-signin button{display:inline-flex;color:var(--primary);margin-left:3px}.signup-mini-brand{display:flex;align-items:center;gap:9px;letter-spacing:.18em}.signup-mini-d{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);font-weight:950}.signup-shell{max-width:1160px;margin:0 auto;padding:54px 4.5%;display:grid;grid-template-columns:.75fr 1.25fr;gap:52px;align-items:start}.signup-intro{padding:35px 0}.signup-logo-mark{width:72px;height:72px;border-radius:20px;padding:2px;background:linear-gradient(180deg,#f8fafc,#64748b,#1e293b);box-shadow:0 18px 42px #0007;margin-bottom:26px}.signup-logo-mark span{width:100%;height:100%;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg,#30343a,#090b0e);font-size:43px;font-weight:950;color:#e2e8f0}.signup-kicker{font-size:11px;font-weight:850;letter-spacing:.15em;color:var(--primary)}.signup-intro h1{font-size:clamp(38px,5vw,62px);line-height:1;letter-spacing:-.055em;margin:14px 0 18px}.signup-intro>p{font-size:17px;line-height:1.7;color:var(--muted);max-width:470px}.signup-note{display:flex;gap:10px;align-items:flex-start;margin-top:28px;padding:14px;border:1px solid var(--border);background:var(--surface);border-radius:15px;color:var(--muted);font-size:12px;line-height:1.5}.signup-note svg{color:var(--primary);flex:none}.signup-card{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:0 25px 80px #00000018}.signup-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.signup-card-head h2{font-size:25px;margin:0 0 4px}.signup-card-head p{color:var(--muted);font-size:13px;margin:0}.signup-step{padding:6px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px}.signup-grid{display:grid;gap:13px;margin-bottom:13px}.signup-grid.two{grid-template-columns:1fr 1fr}.signup-grid.three{grid-template-columns:1fr 1fr 1fr}.signup-field{display:grid;gap:7px;margin-bottom:13px}.signup-field>span{font-size:12px;font-weight:750;color:var(--text)}.signup-field b{color:var(--primary)}.signup-input,.signup-phone{min-height:48px;display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--soft);border-radius:13px;padding:0 13px;color:var(--muted);transition:.18s}.signup-input:focus-within,.signup-phone:focus-within{border-color:color-mix(in srgb,var(--primary) 65%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}.signup-input input,.signup-input select,.signup-phone input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px}.signup-input input::placeholder,.signup-phone input::placeholder{color:var(--muted)}.signup-input select{appearance:none;cursor:pointer}.signup-input select option{background:var(--surface);color:var(--text)}.signup-input button{display:grid;place-items:center;color:var(--muted)}.signup-phone{padding:0}.signup-code{padding:0 12px;border-right:1px solid var(--border);font-weight:800;color:var(--text);height:30px;display:flex;align-items:center}.signup-phone input{padding:0 12px}.signup-section-title{display:flex;align-items:center;gap:7px;margin:24px 0 14px;padding-top:20px;border-top:1px solid var(--border)}.signup-section-title svg{color:var(--primary)}.signup-section-title small{margin-left:3px;color:var(--muted);font-size:11px}.signup-consents{display:grid;gap:11px;padding:18px 0 6px;margin-top:4px;border-top:1px solid var(--border)}.signup-consent{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;color:var(--muted);font-size:12px;line-height:1.55;cursor:pointer}.signup-consent input{position:absolute;opacity:0;pointer-events:none}.signup-check{width:18px;height:18px;border:1px solid var(--border);border-radius:5px;background:var(--soft);display:grid;place-items:center;color:#fff}.signup-consent input:checked+.signup-check{background:var(--primary);border-color:var(--primary)}.signup-consent button{display:inline;color:var(--primary);font-weight:750;text-decoration:underline}.signup-error{margin:10px 0;padding:11px 12px;border:1px solid #ef444466;background:#ef444412;color:#ef9a9a;border-radius:10px;font-size:12px}.signup-submit{width:100%;min-height:50px;margin-top:14px;border-radius:13px;background:var(--primary);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.signup-submit:disabled{opacity:.42;cursor:not-allowed}.signup-submit:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}.signup-legal{text-align:center;color:var(--muted);font-size:10px;line-height:1.55;margin:14px 10px 0}@media(max-width:900px){.signup-shell{grid-template-columns:1fr;gap:10px;padding-top:28px}.signup-intro{padding:10px 0}.signup-intro h1{font-size:42px}.signup-note{max-width:600px}}@media(max-width:640px){.signup-top{height:66px;padding:0 16px}.signup-signin{display:none}.signup-shell{padding:22px 14px 50px}.signup-card{padding:19px;border-radius:20px}.signup-grid.two,.signup-grid.three{grid-template-columns:1fr}.signup-intro h1{font-size:37px}.signup-logo-mark{width:62px;height:62px}.signup-logo-mark span{font-size:37px}.signup-section-title{align-items:flex-start;flex-wrap:wrap}.signup-section-title small{width:100%;margin-left:23px}}
CSS
          git config user.name 'DRIGHT Engineering AI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx src/styles.css
          git commit -m 'chore: integrate signup page' || exit 0
          git push
