name: Add DRIGHT sidebar buttons
on:
  push:
    branches: [main]
jobs:
  add-buttons:
    if: ${{ !contains(github.event.head_commit.message, '[sidebar-buttons-complete]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add requested sidebar buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old='''<button onClick={onWelcome}><LayoutDashboard size={18}/> Dashboard</button><button onClick={onMarket}><ShoppingBag size={18}/> Marketplace</button>'''
          new='''<button onClick={onWelcome}><LayoutDashboard size={18}/> Dashboard</button><button><Sparkles size={18}/> DRIGHT AI</button><button><UserRound size={18}/> Profile</button><button><Megaphone size={18}/> Announcements</button><button><Bell size={18}/> Notifications</button><button onClick={onMarket}><ShoppingBag size={18}/> Marketplace</button>'''
          if old not in s:
              raise SystemExit('Expected sidebar navigation pattern not found; no changes made.')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx
          git diff --cached --quiet || git commit -m 'Add DRIGHT AI profile announcements and notifications sidebar buttons [sidebar-buttons-complete]'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/add-sidebar-buttons.yml
          git commit -m 'Remove completed sidebar button workflow [sidebar-buttons-complete]'
          git push
