<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — DRIGHT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(430px,calc(100% - 40px));background:white;border:1px solid #e2e8f0;border-radius:28px;padding:32px;box-shadow:0 12px 40px #0f172a14}.mark{width:56px;height:56px;border-radius:16px;background:#0f172a;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#64748b;font-weight:700}.title{font-size:34px;margin:7px 0 10px}.sub{color:#64748b;line-height:1.55;margin-bottom:26px}.form{display:grid;gap:18px}.field{display:grid;gap:7px}.label{font-size:13px;font-weight:650}.control{height:51px;width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;padding:0 14px;outline:0}.password{position:relative}.password .control{padding-right:65px}.show{position:absolute;right:10px;top:8px;height:35px;border:0;background:none;color:#64748b;cursor:pointer}.submit{height:51px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6}.message{display:none;margin-bottom:17px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}.message.show{display:block}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.links{display:flex;justify-content:space-between;margin-top:21px;font-size:13px}.links a{color:#64748b}.links a:last-child{color:#0f172a;font-weight:700;text-decoration:none}.bottom{text-align:center;color:#64748b;font-size:13px;margin-top:22px}.bottom a{color:#0f172a;font-weight:700}</style></head><body><main class="card"><div class="mark">D</div><div class="eyebrow">DRIGHT</div><h1 class="title">Welcome back</h1><p class="sub">Sign in to continue to your DRIGHT account.</p><div id="message" class="message"></div><form class="form" id="signin"><label class="field"><span class="label">Email</span><input id="email" class="control" required type="email" autocomplete="username" placeholder="you@example.com"></label><label class="field"><span class="label">Password</span><div class="password"><input id="password" class="control" required type="password" autocomplete="current-password" placeholder="Your password"><button class="show" id="show" type="button">Show</button></div></label><button id="submit" class="submit" type="submit">Sign in →</button></form><div class="links"><a href="#" id="forgot">Forgot password?</a><a href="/signup.html">Create account</a></div><p class="bottom">New to DRIGHT? <a href="/signup.html">Sign up</a></p></main><script>const SUPABASE_URL='https://jkqddapfluevbrzfdtsl.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Oq52s8TINBuJitmrbh0hag_vrPWHKXJ';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const msg=document.getElementById('message');const showMessage=(t,type)=>{msg.textContent=t;msg.className='message show '+type};document.getElementById('show').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('show').textContent=p.type==='password'?'Show':'Hide'};document.getElementById('signin').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;b.textContent='Signing in…';msg.className='message';const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){showMessage(error.message,'error');b.disabled=false;b.textContent='Sign in →';return}showMessage('Signed in successfully. Redirecting…','success');window.location.href='/'};document.getElementById('forgot').onclick=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email)return showMessage('Enter your email first, then select Forgot password.','error');const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/signin.html'});if(error)return showMessage(error.message,'error');showMessage('If an account exists for that email, a password reset email has been sent.','success')};</script></body></html>
