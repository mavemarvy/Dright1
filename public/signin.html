<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — DRIGHT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>Welcome back</h1><p>Sign in to continue to DRIGHT.</p><div id="message"></div><form id="signin"><label>Email</label><input id="email" required type="email" autocomplete="username"><label>Password</label><input id="password" required type="password" autocomplete="current-password"><button id="submit" type="submit">Sign in</button></form><p><a href="/signup.html">Create account</a></p></main><script>const SUPABASE_URL='https://jkqddapfluevbrzfdtsl.supabase.co';const SUPABASE_KEY='sb_publishable_Oq52s8TINBuJitmrbh0hag_vrPWHKXJ';const msg=document.getElementById('message');const setMsg=(text,ok=false)=>{msg.textContent=text;msg.style.color=ok?'green':'crimson'};let client;try{if(!window.supabase?.createClient)throw new Error('Authentication service is still loading. Please refresh and try again.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){setMsg(e.message)}document.getElementById('signin').addEventListener('submit',async e=>{e.preventDefault();if(!client){setMsg('Authentication service failed to load. Please refresh and try again.');return}const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Signing in…';setMsg('');try{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await client.auth.signInWithPassword({email,password});if(error){setMsg(error.message);btn.disabled=false;btn.textContent='Sign in';return}if(!data?.session){setMsg('Sign in did not create a session. Please try again.');btn.disabled=false;btn.textContent='Sign in';return}setMsg('Signed in. Opening DRIGHT…',true);window.location.assign('/?destination=marketplace')}catch(e){setMsg(e?.message||'Unable to sign in. Please check your connection and try again.');btn.disabled=false;btn.textContent='Sign in'}});</script></body></html>
