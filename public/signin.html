<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — DRIGHT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--bg:#f8fafc;--card:#fff;--field:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#0f172a;--accentText:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input{font:inherit}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:32px;box-shadow:0 12px 40px rgba(15,23,42,.08)}.mark{width:56px;height:56px;border-radius:16px;background:#0f172a;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#64748b;font-weight:700}.title{font-size:34px;letter-spacing:-.04em;margin:7px 0 10px}.sub{color:var(--muted);line-height:1.55;margin:0 0 26px;font-size:15px}.form{display:grid;gap:18px}.field{display:grid;gap:7px}.label{font-size:13px;font-weight:650;color:#334155}.control{height:51px;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--text);padding:0 14px;outline:0}.control::placeholder{color:#94a3b8}.control:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.18)}.password{position:relative}.password .control{padding-right:72px}.show{position:absolute;right:10px;top:8px;height:35px;border:0;background:transparent;color:#64748b;font-size:12px;cursor:pointer}.submit{height:51px;border:0;border-radius:12px;background:var(--accent);color:var(--accentText);font-weight:800;cursor:pointer}.submit:hover{background:#1e293b}.submit:disabled{opacity:.6;cursor:wait}.links{display:flex;justify-content:space-between;margin-top:21px;font-size:13px}.links a{color:#64748b;text-decoration:underline;text-underline-offset:3px}.links a:last-child{color:#0f172a;font-weight:700;text-decoration:none}.bottom{text-align:center;color:#64748b;font-size:13px;margin:22px 0 0}.bottom a{color:#0f172a;font-weight:700;text-decoration:none}.message{display:none;margin:0 0 17px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}.message.show{display:block}.message.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.message.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}@media(max-width:500px){.card{padding:25px;border-radius:24px}}</style></head><body><main class="page"><section class="card"><div class="mark">D</div><div class="eyebrow">DRIGHT</div><h1 class="title">Welcome back</h1><p class="sub">Sign in to continue to your DRIGHT account.</p><div id="message" class="message" role="status"></div><form class="form" id="signin"><label class="field"><span class="label">Email</span><input id="email" class="control" required type="email" autocomplete="username" placeholder="you@example.com"></label><label class="field"><span class="label">Password</span><div class="password"><input id="password" class="control" required type="password" autocomplete="current-password" placeholder="Your password"><button class="show" id="show" type="button">Show</button></div></label><button id="submit" class="submit" type="submit">Sign in →</button></form><div class="links"><a href="#" id="forgot">Forgot password?</a><a href="/signup.html">Create account</a></div><p class="bottom">New to DRIGHT? <a href="/signup.html">Sign up</a></p></section></main><script>const SUPABASE_URL='https://jkqddapfluevbrzfdtsl.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Oq52s8TINBuJitmrbh0hag_vrPWHKXJ';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const msg=document.getElementById('message');function showMessage(text,type){msg.textContent=text;msg.className='message show '+type}document.getElementById('show').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('show').textContent=p.type==='password'?'Show':'Hide'};document.getElementById('signin').onsubmit=async e=>{e.preventDefault();msg.className='message';const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Signing in…';const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){showMessage(error.message,'error');btn.disabled=false;btn.textContent='Sign in →';return}showMessage('Signed in successfully. Redirecting…','success');setTimeout(()=>{window.location.href='/';},500)};document.getElementById('forgot').onclick=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email)return showMessage('Enter your email first, then select Forgot password.','error');const {error}=await supabase.auth.resetPasswordForEmail(email);if(error)return showMessage(error.message,'error');showMessage('If an account exists for that email, a password reset email has been sent.','success')};</script></body></html>
