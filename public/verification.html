<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify your email — DRIGHT</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(470px,calc(100% - 32px));background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:42px 32px;text-align:center;box-shadow:0 18px 55px rgba(15,23,42,.09)}.icon{width:76px;height:76px;border-radius:22px;background:#0f172a;color:#fff;display:grid;place-items:center;margin:0 auto 25px;font-size:42px;font-weight:900;box-shadow:0 10px 25px rgba(15,23,42,.16)}h1{font-size:30px;letter-spacing:-.035em;margin:0 0 10px}p{color:#64748b;line-height:1.6;margin:0}.bar{margin:25px 0 22px;padding:17px 18px;border:1px solid #dbeafe;background:#eff6ff;border-radius:14px;color:#1e40af;font-weight:750;font-size:15px}.sub{font-size:13px;margin-bottom:25px}.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:12px;background:#0f172a;color:#fff;text-decoration:none;font-weight:800}.small{margin-top:18px;font-size:12px}.status{display:none;margin-top:15px;padding:11px;border-radius:10px;font-size:13px}.status.show{display:block}.ok{background:#f0fdf4;color:#166534}.wait{background:#f8fafc;color:#64748b}.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">D</div>
    <h1>Verify your email</h1>
    <div class="bar">We sent you a verification link.</div>
    <p class="sub">Please check your email and click the verification link to activate your DRIGHT account.</p>
    <a class="btn" href="/signin.html">Continue to sign in</a>
    <p class="small">After you verify your email, DRIGHT will take you to the marketplace automatically.</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const client = window.supabase.createClient(
      'https://jkqddapfluevbrzfdtsl.supabase.co',
      'sb_publishable_Oq52s8TINBuJitmrbh0hag_vrPWHKXJ',
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );
    const status = document.getElementById('status');
    let redirecting = false;

    function show(message, type) {
      status.textContent = message;
      status.className = 'status show ' + type;
    }

    function goToMarketplace() {
      if (redirecting) return;
      redirecting = true;
      show('Account verified. Redirecting to the marketplace…', 'ok');
      setTimeout(() => location.replace('/?destination=marketplace'), 350);
    }

    async function verify() {
      try {
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        const callbackError = params.get('error_description') || params.get('error');

        if (callbackError) {
          show(callbackError, 'bad');
          return;
        }

        // Current Supabase OAuth/email-confirmation flow (PKCE).
        if (code) {
          show('Verifying your account…', 'wait');
          const { data, error } = await client.auth.exchangeCodeForSession(code);
          if (error) {
            show(error.message || 'This verification link is invalid or has expired.', 'bad');
            return;
          }
          if (data.session) {
            goToMarketplace();
            return;
          }
        }

        // Backwards compatibility for older implicit-flow links.
        if (location.hash.includes('access_token')) {
          show('Verifying your account…', 'wait');
          const hash = new URLSearchParams(location.hash.substring(1));
          const accessToken = hash.get('access_token');
          const refreshToken = hash.get('refresh_token');
          if (accessToken && refreshToken) {
            const { data, error } = await client.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            });
            if (error) {
              show(error.message || 'This verification link is invalid or has expired.', 'bad');
              return;
            }
            if (data.session) {
              goToMarketplace();
              return;
            }
          }
        }

        const { data, error } = await client.auth.getSession();
        if (error) {
          show(error.message, 'bad');
          return;
        }
        if (data.session) {
          goToMarketplace();
        }
      } catch (error) {
        show(error instanceof Error ? error.message : 'Unable to complete verification. Please try signing in again.', 'bad');
      }
    }

    verify();
    client.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) goToMarketplace();
    });
  </script>
</body>
</html>
