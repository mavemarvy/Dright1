1 class="title">Create account</h1><p class="sub">Create your DRIGHT account to discover, buy, sell, promote, learn and find opportunities.</p><div id="message" class="message"></div><form class="form" id="signup"><div class="row"><label class="field"><span class="label">First name <span class="required">*</span></span><input id="firstName" class="control" required placeholder="First name" autocomplete="given-name"></label><label class="field"><span class="label">Last name <span class="required">*</span></span><input id="lastName" class="control" required placeholder="Last name" autocomplete="family-name"></label></div><label class="field"><span class="label">Username <span class="required">*</span></span><input id="username" class="control" required placeholder="your_username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}"></label><label class="field"><span class="label">Email <span class="required">*</span></span><input id="email" class="control" required type="email" placeholder="you@example.com" autocomplete="email"></label><div class="row"><label class="field"><span class="label">Password <span class="required">*</span></span><input id="password" class="control" required minlength="8" type="password" placeholder="8+ characters" autocomplete="new-password"></label><label class="field"><span class="label">Confirm password <span class="required">*</span></span><input id="confirm" class="control" required minlength="8" type="password" placeholder="Confirm password" autocomplete="new-password"></label></div><div class="row"><label class="field"><span class="label">Date of birth <span class="required">*</span></span><input id="dob" class="control" required type="date"></label><label class="field"><span class="label">Country <span class="required">*</span></span><select id="country" class="control" required></select></label></div><label class="field"><span class="label">Phone number <span class="required">*</span></span><div class="phone"><div class="countrybox"><button type="button" class="countrybutton" id="countryButton"><img class="flag" id="phoneFlag" src="https://flagcdn.com/w40/ng.png" alt="Nigeria flag"><span class="code" id="phoneCode">+234</span><span class="chev">⌄</span></button><div class="menu" id="menu"><input class="search" id="countrySearch" placeholder="Search country or calling code"><div id="options"></div></div></div><input id="phone" required type="tel" inputmode="tel" placeholder="Phone number" autocomplete="tel"></div></label><label class="field"><span class="label">Address line 1 <span class="required">*</span></span><input id="address1" class="control" required placeholder="Street address" autocomplete="street-address"></label><label class="field"><span class="label">Address line 2</span><input id="address2" class="control" placeholder="Apartment, suite, etc. (optional)"></label><div class="row"><label class="field"><span class="label">City <span class="required">*</span></span><input id="city" class="control" required autocomplete="address-level2"></label><label class="field"><span class="label">State / Province / Region <span class="required">*</span></span><input id="state" class="control" required autocomplete="address-level1"></label></div><label class="field"><span class="label">Postal / ZIP code <span class="required">*</span></span><input id="postal" class="control" required autocomplete="postal-code"></label><div class="checks"><label class="check"><input id="terms" required type="checkbox"><span>I agree to DRIGHT's Terms and Conditions.</span></label><label class="check"><input id="cookies" required type="checkbox"><span>I accept DRIGHT's Cookie Policy and understand that essential cookies are required for the service.</span></label></div><button id="submit" class="submit" type="submit">Create my DRIGHT account</button></form><p class="bottom">Already have an account? <a href="/signin.html">Sign in</a></p><p class="age">DRIGHT accounts start at age 13. Some features may have higher age r
