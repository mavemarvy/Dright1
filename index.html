<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRIGHT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <link rel="stylesheet" href="/src/dright-theme-overrides.css" />
    <script>
      // Wire the existing DRIGHT welcome/header Sign up action to the dedicated signup page.
      document.addEventListener('click', function (event) {
        const target = event.target && event.target.closest ? event.target.closest('button') : null;
        if (!target) return;
        const label = (target.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
        if (label === 'sign up' || label.includes('sign up')) {
          event.preventDefault();
          window.location.assign('/signup.html');
        }
      });
    </script>
  </body>
</html>
